<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="alice-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843" />
      <stop offset="45%" stop-color="#be185d" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#alice-bg)" />

  <!-- BMX Bike Stunt Silhouette & Ramp -->
  <g transform="translate(140, 50)" fill="#0f172a">
    <!-- Ramp -->
    <path d="M 0 170 Q 70 170 110 100 L 125 105 Q 85 180 0 180 Z" fill="#374151" opacity="0.6" />
    <!-- BMX Bike in air -->
    <g transform="translate(80, 20) rotate(-25)">
      <!-- Wheels -->
      <circle cx="20" cy="50" r="16" fill="none" stroke="#000000" stroke-width="4" />
      <circle cx="70" cy="50" r="16" fill="none" stroke="#000000" stroke-width="4" />
      <!-- Frame -->
      <line x1="20" y1="50" x2="45" y2="50" stroke="#000000" stroke-width="4" />
      <line x1="45" y1="50" x2="65" y2="28" stroke="#000000" stroke-width="4" />
      <line x1="45" y1="50" x2="35" y2="25" stroke="#000000" stroke-width="4" />
      <line x1="35" y1="25" x2="20" y2="50" stroke="#000000" stroke-width="4" />
      <line x1="65" y1="28" x2="70" y2="50" stroke="#000000" stroke-width="4" />
      <!-- Handlebars & Seat -->
      <line x1="65" y1="28" x2="62" y2="18" stroke="#000000" stroke-width="4" />
      <line x1="35" y1="25" x2="30" y2="20" stroke="#000000" stroke-width="4" />
    </g>
  </g>

  <!-- Queen of Hearts Cards & Rose Symbols -->
  <g transform="translate(290, 80)">
    <!-- Ace of Hearts card tilted -->
    <rect x="-20" y="-30" width="40" height="60" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" transform="rotate(15)" opacity="0.95" />
    <path d="M -3 -5 C -3 -12 -12 -12 -12 -5 C -12 2 -3 8 0 12 C 3 8 12 2 12 -5 C 12 -12 3 -12 3 -5 Z" fill="#e11d48" transform="rotate(15) scale(0.75)" />

    <!-- Ace of Spades card behind -->
    <rect x="20" y="-10" width="40" height="60" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" transform="rotate(-20)" opacity="0.95" />
    <path d="M 40 20 C 40 14 32 14 32 20 C 32 26 40 32 40 32 C 40 32 48 26 48 20 C 48 14 40 14 40 20 Z" fill="#0f172a" transform="scale(0.8) translate(5, 5)" />
  </g>

  <!-- Cheshire Cat Grin Silhouette in corner -->
  <path d="M 230 40 Q 280 75 330 40 Q 280 58 230 40 Z" fill="#fef08a" opacity="0.8" />
  <ellipse cx="255" cy="30" rx="8" ry="12" fill="#fef08a" opacity="0.8" transform="rotate(-15 255 30)" />
  <ellipse cx="305" cy="30" rx="8" ry="12" fill="#fef08a" opacity="0.8" transform="rotate(15 305 30)" />
</svg>
