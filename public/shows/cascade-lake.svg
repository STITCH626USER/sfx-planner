<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="100%" height="100%">
  <defs>
    <linearGradient id="lake-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#021f1d"/>
      <stop offset="50%" stop-color="#042f2c"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <radialGradient id="fountain-glow" cx="75%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0d9488" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#021f1d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="360" height="200" fill="url(#lake-sky)"/>
  <circle cx="270" cy="110" r="90" fill="url(#fountain-glow)"/>

  <!-- Drone Fleet geometric patterns in the sky -->
  <g fill="#a7f3d0">
    <circle cx="180" cy="30" r="2.5"/>
    <circle cx="205" cy="22" r="2.5"/>
    <circle cx="230" cy="18" r="3"/>
    <circle cx="255" cy="20" r="3"/>
    <circle cx="280" cy="26" r="3.5"/>
    <circle cx="305" cy="38" r="2.5"/>
    <circle cx="325" cy="55" r="2.5"/>
    
    <circle cx="220" cy="42" r="2"/>
    <circle cx="245" cy="38" r="2.5"/>
    <circle cx="270" cy="42" r="2.5"/>
    <circle cx="290" cy="52" r="2"/>
  </g>

  <!-- Luminous Aquatic Fountains Jets with Beams -->
  <g stroke-linecap="round">
    <path d="M 270 160 Q 235 105 205 75" stroke="#38bdf8" stroke-width="2.5" fill="none" opacity="0.9"/>
    <path d="M 270 160 Q 252 95 235 60" stroke="#67e8f9" stroke-width="2.5" fill="none" opacity="0.95"/>
    <path d="M 270 160 Q 270 85 270 45" stroke="#ecfeff" stroke-width="3" fill="none" opacity="1"/>
    <path d="M 270 160 Q 288 95 305 60" stroke="#67e8f9" stroke-width="2.5" fill="none" opacity="0.95"/>
    <path d="M 270 160 Q 305 105 335 75" stroke="#38bdf8" stroke-width="2.5" fill="none" opacity="0.9"/>
  </g>

  <!-- Lake surface reflections -->
  <rect x="0" y="155" width="360" height="45" fill="#021413"/>
  <line x1="180" y1="165" x2="340" y2="165" stroke="#2dd4bf" stroke-width="2" opacity="0.7" stroke-dasharray="10,5"/>
  <line x1="210" y1="175" x2="320" y2="175" stroke="#38bdf8" stroke-width="1.8" opacity="0.6" stroke-dasharray="14,6"/>
  <line x1="240" y1="185" x2="300" y2="185" stroke="#67e8f9" stroke-width="1.5" opacity="0.5" stroke-dasharray="8,4"/>
</svg>
