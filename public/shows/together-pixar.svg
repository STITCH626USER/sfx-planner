<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="tg-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#4f46e5" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.95" />
    </linearGradient>
    <radialGradient id="tg-ball" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </radialGradient>
  </defs>
  <rect width="400" height="240" fill="url(#tg-bg)" />

  <!-- Musical Orchestra Staves & Notes Floating -->
  <path d="M 0 160 Q 150 110 400 130" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" fill="none" />
  <path d="M 0 168 Q 150 118 400 138" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" fill="none" />
  <path d="M 0 176 Q 150 126 400 146" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" fill="none" />
  <path d="M 0 184 Q 150 134 400 154" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" fill="none" />
  <path d="M 0 192 Q 150 142 400 162" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" fill="none" />

  <!-- Iconic Pixar Luxo Ball on Right -->
  <g transform="translate(260, 60)">
    <circle cx="60" cy="60" r="54" fill="url(#tg-ball)" />
    <!-- Blue Stripe -->
    <path d="M 8 72 C 22 55 98 55 112 72 L 108 85 C 96 70 24 70 12 85 Z" fill="#2563eb" />
    <!-- Red Star in Center -->
    <polygon points="60,40 64,52 76,52 66,60 70,72 60,64 50,72 54,60 44,52 56,52" fill="#dc2626" />
  </g>

  <!-- Musical Notes -->
  <g fill="#ffffff" opacity="0.85">
    <!-- Eighth note 1 -->
    <ellipse cx="140" cy="115" rx="8" ry="6" transform="rotate(-20 140 115)" />
    <line x1="147" y1="113" x2="147" y2="85" stroke="#ffffff" stroke-width="2.5" />
    <path d="M 147 85 Q 160 88 158 100" stroke="#ffffff" stroke-width="2" fill="none" />

    <!-- Double note -->
    <ellipse cx="190" cy="130" rx="7" ry="5.5" transform="rotate(-20 190 130)" />
    <line x1="196" y1="128" x2="196" y2="100" stroke="#ffffff" stroke-width="2" />
    <ellipse cx="220" cy="122" rx="7" ry="5.5" transform="rotate(-20 220 122)" />
    <line x1="226" y1="120" x2="226" y2="92" stroke="#ffffff" stroke-width="2" />
    <line x1="196" y1="100" x2="226" y2="92" stroke="#ffffff" stroke-width="3" />
  </g>
</svg>
