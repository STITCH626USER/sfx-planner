<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="ds-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a" />
      <stop offset="50%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="ds-mandala" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="400" height="240" fill="url(#ds-bg)" />

  <!-- Doctor Strange Eldritch Mandala Spell Ring -->
  <g transform="translate(280, 120)">
    <!-- Outer Sparks Circle -->
    <circle cx="0" cy="0" r="85" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6,8" opacity="0.9" />
    <circle cx="0" cy="0" r="75" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.8" />
    <!-- Outer Square in Circle -->
    <rect x="-53" y="-53" width="106" height="106" fill="none" stroke="#f59e0b" stroke-width="2.5" transform="rotate(45)" opacity="0.8" />
    <rect x="-53" y="-53" width="106" height="106" fill="none" stroke="#fbbf24" stroke-width="2" transform="rotate(0)" opacity="0.8" />
    <!-- Inner Rings -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#d97706" stroke-width="2.5" opacity="0.85" />
    <circle cx="0" cy="0" r="32" fill="none" stroke="#fde047" stroke-width="1.8" stroke-dasharray="4,4" />
    <!-- Eye of Agamotto Center -->
    <ellipse cx="0" cy="0" rx="16" ry="10" fill="#10b981" opacity="0.75" />
    <circle cx="0" cy="0" r="5" fill="#34d399" />
  </g>

  <!-- Sorcerer Silhouette with Cloak of Levitation -->
  <g transform="translate(140, 60)" fill="#090d16">
    <!-- Cloak collar high silhouette -->
    <path d="M 40 45 L 20 20 L 35 48 Z" />
    <path d="M 60 45 L 80 20 L 65 48 Z" />
    <!-- Head -->
    <circle cx="50" cy="40" r="14" />
    <!-- Body & Cloak -->
    <path d="M 35 52 L 65 52 L 85 160 L 15 160 Z" />
    <!-- Arms posing spell -->
    <path d="M 35 60 L 5 80 L 15 100 L 35 85 Z" />
    <path d="M 65 60 L 105 75 L 115 65 L 75 55 Z" />
  </g>
</svg>
