<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="100%" height="100%">
  <defs>
    <linearGradient id="parade-fire" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="parade-glow" cx="80%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="360" height="200" fill="url(#parade-glow)"/>
  
  <!-- Steampunk Dragon Floating Head & Neck (Maleficent Float) -->
  <g transform="translate(140, 20) scale(0.9)" fill="#090d16">
    <!-- Huge Horns curved back -->
    <path d="M 95 45 C 120 15 155 5 190 -10 C 170 12 150 30 135 48 Z" fill="#111827"/>
    <path d="M 85 45 C 105 20 135 12 165 5 C 148 22 130 38 118 52 Z" fill="#1f2937"/>
    
    <!-- Dragon Head & Snout -->
    <path d="M 45 95 C 60 75 90 70 115 65 C 125 55 130 45 125 35 C 100 40 85 50 65 65 L 45 75 Z"/>
    <circle cx="95" cy="62" r="5" fill="#22c55e"/>
    <circle cx="96" cy="61" r="2" fill="#fff"/>
    
    <!-- Upper Jaw & Teeth -->
    <path d="M 45 75 C 25 80 10 92 0 102 C 15 102 30 98 48 95 Z"/>
    <polygon points="12,102 16,95 20,102" fill="#fff"/>
    <polygon points="26,100 30,93 34,100" fill="#fff"/>
    <polygon points="38,98 42,91 46,98" fill="#fff"/>
    
    <!-- Open Mouth & Lower Jaw -->
    <path d="M 8 115 C 25 125 50 120 70 105 L 50 100 C 35 108 20 112 8 115 Z"/>
    <polygon points="15,114 18,107 22,114" fill="#fff"/>
    <polygon points="28,111 31,105 35,111" fill="#fff"/>
    
    <!-- Massive Bellows of Flame -->
    <path d="M 8 100 C -30 90 -70 110 -110 115 C -65 125 -30 120 5 116 Z" fill="url(#parade-fire)"/>
    <path d="M 5 104 C -20 98 -50 112 -80 114 C -45 118 -20 114 3 112 Z" fill="#fff" opacity="0.9"/>
    
    <!-- Steampunk Mechanical Neck with Segmented Plates -->
    <path d="M 115 65 C 135 85 145 120 150 170 L 115 170 C 105 130 95 100 70 105 Z" fill="#0f172a"/>
    <!-- Copper Ribs & Rivets -->
    <path d="M 90 100 Q 110 115 130 110" stroke="#f59e0b" stroke-width="3" fill="none"/>
    <path d="M 98 125 Q 118 140 138 135" stroke="#f59e0b" stroke-width="3" fill="none"/>
    <path d="M 105 150 Q 125 165 145 160" stroke="#f59e0b" stroke-width="3" fill="none"/>
    
    <!-- Giant Rotating Steampunk Gear -->
    <circle cx="130" cy="135" r="22" fill="none" stroke="#d97706" stroke-width="5" stroke-dasharray="10,6"/>
    <circle cx="130" cy="135" r="10" fill="#b45309"/>
    <circle cx="130" cy="135" r="4" fill="#fef08a"/>
  </g>
  
  <!-- Floating Parade Sparkles -->
  <g fill="#fde047" opacity="0.75">
    <polygon points="80,40 82,45 87,45 83,48 85,53 80,50 75,53 77,48 73,45 78,45"/>
    <polygon points="50,70 51,74 55,74 52,76 53,80 50,78 47,80 48,76 45,74 49,74"/>
    <circle cx="30" cy="50" r="3" fill="#f43f5e"/>
    <circle cx="110" cy="30" r="2.5" fill="#38bdf8"/>
    <circle cx="70" cy="140" r="3" fill="#ec4899"/>
  </g>
</svg>
