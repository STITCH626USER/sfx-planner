<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="df-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#df-sky)" />

  <!-- Gear Wheels & Factory Chimneys (Disney Junior Dream Factory) -->
  <g fill="#1e293b" opacity="0.95">
    <!-- Chimneys -->
    <rect x="230" y="80" width="18" height="120" />
    <path d="M 226 80 L 252 80 L 248 72 L 230 72 Z" />
    <rect x="260" y="60" width="22" height="140" />
    <path d="M 255 60 L 287 60 L 282 50 L 260 50 Z" />

    <!-- Big Dream Factory Cog -->
    <g transform="translate(320, 110)">
      <circle cx="0" cy="0" r="38" fill="#0f172a" />
      <circle cx="0" cy="0" r="46" fill="none" stroke="#0f172a" stroke-width="12" stroke-dasharray="14,10" />
      <circle cx="0" cy="0" r="16" fill="#fbbf24" />
    </g>

    <g transform="translate(260, 160)">
      <circle cx="0" cy="0" r="24" fill="#0f172a" />
      <circle cx="0" cy="0" r="30" fill="none" stroke="#0f172a" stroke-width="8" stroke-dasharray="10,8" />
      <circle cx="0" cy="0" r="10" fill="#f43f5e" />
    </g>
  </g>

  <!-- Smoke / Dream Clouds coming from chimneys -->
  <circle cx="270" cy="35" r="15" fill="#ffffff" opacity="0.8" />
  <circle cx="285" cy="22" r="18" fill="#ffffff" opacity="0.7" />
  <circle cx="310" cy="18" r="22" fill="#ffffff" opacity="0.6" />

  <!-- Floating Musical Notes and Rainbow Sparkles -->
  <circle cx="160" cy="70" r="4" fill="#f43f5e" />
  <circle cx="190" cy="90" r="5" fill="#8b5cf6" />
  <circle cx="140" cy="110" r="4" fill="#10b981" />
  <polygon points="180,45 183,52 190,52 184,57 186,64 180,60 174,64 176,57 170,52 177,52" fill="#ffffff" />
</svg>
